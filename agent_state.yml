  # active_goal: none
  # recent_events:
  #   - Agent encountered agent_02
  #   - Food supply decreased

type: object
required:
  - agent_id
  - health
  - hunger
  - goal
  # Future required fields:
  # - time
  # - location
  # - inventory
  # - known_agents
  # - nearby_objects
  # - active_goal
  # - recent_events
properties:
  agent_id:
    type: string
    description: Unique identifier of the agent.
    example: agent_01
  health:
    type: integer
    minimum: 0
    maximum: 100
    example: 100
  hunger:
    type: integer
    minimum: 0
    maximum: 100
    example: 72
  goal:
    type: string
    description: Current objective that should guide the decision.
    example: strengthen relationships

